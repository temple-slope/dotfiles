name: chezmoi

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin

      - name: Prepare dummy .env.chezmoi
        run: |
          # .chezmoi.yaml.tmpl が grep で読み込むため、CI 用ダミーを作成
          cat > .env.chezmoi <<'EOF'
          GIT_USER_NAME=ci
          GIT_USER_EMAIL=ci@example.com
          GIT_SIGNING_KEY=ssh-ed25519 AAAA
          EOF

      - name: Render all template files
        run: |
          failed=0
          while IFS= read -r f; do
            # .chezmoi.yaml.tmpl は chezmoi 自身が処理する設定テンプレなので
            # --init フラグ経由で間接的に検証される。個別レンダリングはスキップ。
            [ "$f" = ".chezmoi.yaml.tmpl" ] && continue

            echo "→ $f"
            err=$(mktemp)
            if ! chezmoi execute-template \
                --source="$PWD" \
                --init \
                --promptBool machine.installBrewBundle=false \
                < "$f" >/dev/null 2>"$err"; then
              echo "::error file=$f::template render failed"
              cat "$err"
              failed=1
            fi
            rm -f "$err"
          done < <(git ls-files '*.tmpl')
          exit "$failed"

      - name: Render modify_ templates against an empty target
        run: |
          # modify_ ファイルは .chezmoi.stdin（既存ターゲット）を受け取るため execute-template では
          # 検証できない。空のホームに対して chezmoi cat し、新規マシン相当の出力を構文検証する。
          dest="$RUNNER_TEMP/home"
          cfg="$RUNNER_TEMP/chezmoi.yaml"
          mkdir -p "$dest"
          : > "$cfg"
          cz() { chezmoi --config="$cfg" --source="$PWD" --destination="$dest" "$@"; }
          failed=0
          while IFS= read -r f; do
            echo "→ $f"
            target=$(cz target-path "$PWD/$f")
            out=$(mktemp)
            if ! cz cat "$target" > "$out"; then
              echo "::error file=$f::modify template render failed"
              failed=1
            else
              case "$target" in
                *.json) python3 -m json.tool "$out" >/dev/null || { echo "::error file=$f::invalid JSON output"; failed=1; } ;;
                *.toml) python3 -c 'import sys,tomllib; tomllib.load(open(sys.argv[1],"rb"))' "$out" || { echo "::error file=$f::invalid TOML output"; failed=1; } ;;
              esac
            fi
            rm -f "$out"
          done < <(git ls-files '*modify_*')
          exit "$failed"
